[project]
name = "bridgeline"
version = "0.1.0"
description = "A crawling agent harness where page content structurally cannot become an instruction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "bouncer-core>=0.1.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/Ezed9/bridgeline"
Issues = "https://github.com/Ezed9/bridgeline/issues"

[project.scripts]
bridgeline = "bridgeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgeline"]
