[project]
name = "forgeiq"
version = "0.1.0"
description = "Agentic software engineering harness with LangGraph orchestration and MCP security"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "mcp>=1.10",
    "mcp-bouncer>=0.1.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "flask>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring Gemini API key",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeiq"]
