name: Release

# Tag-driven, under PyPI Trusted Publishing (OIDC): no API token exists in this
# repository's secrets. A manual run publishes to TestPyPI instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: The tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short --frozen)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match bridgeline $version"
            exit 1
          fi

      # bridgeline's Layer 2 is bouncer-core. Publishing before that dependency
      # exists on PyPI would ship a package nobody can install.
      - name: bouncer-core must already be on PyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          curl -sf https://pypi.org/pypi/bouncer-core/json > /dev/null || {
            echo "::error::bouncer-core is not on PyPI yet; publish it first"
            exit 1
          }

      - name: Build
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
